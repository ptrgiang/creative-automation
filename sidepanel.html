<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Automation</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M30.5 27.5 20.4 17.4c-3.2-3.2-8.2-3-11.1.4-2.7 3.2-2.1 8 1.2 10.6l10.3 8.2 9.7-9.1Z" fill="#2F6FD0"/>
        <path d="M36.5 30.5 46.6 20.4c3.2-3.2 3-8.2-.4-11.1-3.2-2.7-8-2.1-10.6 1.2l-8.2 10.3 9.1 9.7Z" fill="#2F6FD0"/>
        <path d="M33.5 36.5 43.6 46.6c3.2 3.2 8.2 3 11.1-.4 2.7-3.2 2.1-8-1.2-10.6l-10.3-8.2-9.7 9.1Z" fill="#2F6FD0"/>
        <path d="M27.5 33.5 17.4 43.6c-3.2 3.2-3 8.2.4 11.1 3.2 2.7 8 2.1 10.6-1.2l8.2-10.3-9.1-9.7Z" fill="#2F6FD0"/>
      </svg>
      <span>Creative Automation</span>
    </div>
    <a class="github-link" href="https://github.com/ptrgiang/creative-automation" target="_blank" rel="noopener noreferrer" title="Open GitHub repository" aria-label="Open Creative Automation on GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 .5C5.65.5.99 5.15.99 11.7c0 4.96 3.13 9.17 7.48 10.65.55.1.75-.24.75-.53 0-.26-.01-1.13-.02-2.05-3.04.67-3.68-1.31-3.68-1.31-.5-1.29-1.22-1.63-1.22-1.63-.99-.69.08-.68.08-.68 1.1.08 1.68 1.16 1.68 1.16.98 1.72 2.57 1.22 3.2.93.1-.73.38-1.22.69-1.5-2.43-.28-4.99-1.25-4.99-5.54 0-1.22.43-2.22 1.13-3-.11-.28-.49-1.42.11-2.96 0 0 .92-.3 3.02 1.15A10.21 10.21 0 0 1 12 6c.93 0 1.87.13 2.75.38 2.1-1.45 3.02-1.15 3.02-1.15.6 1.54.22 2.68.11 2.96.7.78 1.13 1.78 1.13 3 0 4.31-2.56 5.26-5 5.53.39.35.74 1.02.74 2.06 0 1.49-.01 2.69-.01 3.05 0 .29.2.64.76.53a11.25 11.25 0 0 0 7.47-10.65C22.97 5.15 18.35.5 12 .5Z"/>
      </svg>
    </a>
  </header>

  <!-- Auth error screen -->
  <div id="auth-error" class="screen hidden">
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#EA4335" stroke-width="1.5"/>
        <path d="M12 7v6M12 16v.5" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>Not logged in to NotebookLM</p>
      <a href="https://notebooklm.google.com" target="_blank" class="btn btn-primary">Open NotebookLM</a>
      <button id="retry-auth" class="btn btn-ghost">Retry</button>
    </div>
  </div>

  <!-- Main screen -->
  <div id="main-screen" class="screen hidden">
    <!-- Amazon Search section -->
    <div id="amazon-section" class="amazon-section">
      <div class="amazon-section-header">
        <a class="amazon-link" href="https://amazon-crawler.netlify.app/" target="_blank" rel="noopener noreferrer">
          <img class="amazon-icon" src="amazon-search-icon.ico" alt="" aria-hidden="true">
          <span>Amazon Search</span>
        </a>
      </div>
      <div id="amazon-info" class="amazon-info">Open Compare Listings</div>
      <button id="amazon-upload-btn" class="btn btn-primary btn-sm" disabled>
        Upload Listings to NotebookLM
      </button>
      <div id="amazon-progress" class="amazon-progress hidden"></div>
    </div>

    <!-- Notebook selector -->
    <div class="notebook-bar">
      <select id="notebook-select" class="native-notebook-select" aria-hidden="true" tabindex="-1">
        <option value="">Select a notebook...</option>
      </select>
      <div id="notebook-picker" class="notebook-picker">
        <div id="notebook-display" class="notebook-display">
          <button id="notebook-picker-button" class="notebook-picker-button" type="button">
            <span id="notebook-picker-label" class="notebook-picker-label">Select a notebook...</span>
            <span id="notebook-picker-count" class="notebook-picker-count"></span>
          </button>
          <button id="rename-notebook" class="icon-btn hidden" title="Rename notebook" aria-label="Rename notebook">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div id="rename-inline" class="rename-inline hidden">
          <input id="rename-inline-input" class="rename-inline-input" type="text" maxlength="120" placeholder="Name this notebook">
          <button id="rename-inline-confirm" class="icon-btn icon-btn-accent" title="Save name" aria-label="Save notebook name">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="rename-inline-cancel" class="icon-btn" title="Cancel rename" aria-label="Cancel notebook edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div id="notebook-picker-menu" class="notebook-picker-menu hidden"></div>
      </div>
      <button id="refresh-notebooks" class="icon-btn" title="Refresh NotebookLM and Gemini sessions" aria-label="Refresh NotebookLM and Gemini sessions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="create-notebook" class="icon-btn icon-btn-accent" title="New notebook" aria-label="New notebook">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- No notebook selected -->
    <div id="no-notebook" class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#666" stroke-width="1.5"/>
      </svg>
      <p>Select a notebook to begin</p>
    </div>

    <!-- Notebook content (tabs) -->
    <div id="notebook-content" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="sources">Sources</button>
      </div>

      <!-- Chat tab -->
      <div id="tab-chat" class="tab-panel">
        <div id="messages" class="messages"></div>
        <div class="chat-footer">
          <div class="input-row">
            <button id="clear-chat" class="inline-tool-btn" title="Clear chat" aria-label="Clear chat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M8 6V4h8v2M6 6l1 16h10l1-16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <textarea id="query-input" placeholder="Ask your notebook…" rows="1"></textarea>
            <button id="send-btn" class="send-btn" disabled aria-label="Send message">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Sources tab -->
      <div id="tab-sources" class="tab-panel hidden">
        <div id="sources-list" class="sources-list"></div>
        <div class="source-add">
          <div class="source-url-row">
            <input id="file-input" type="file" accept=".pdf,.txt,.md,.docx,.csv,.epub,.mp3,.m4a,.wav,.aac,.ogg,.mp4,.jpg,.jpeg,.png,.gif,.webp" hidden>
            <button id="upload-file-btn" class="inline-tool-btn" title="Upload file" aria-label="Upload file">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <input id="source-url" type="url" placeholder="https://…  or YouTube URL">
            <button id="add-source-btn" class="send-btn" aria-label="Add URL" title="Add URL" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span id="upload-status" class="upload-status"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div id="confirm-dialog" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-card">
      <div class="confirm-accent" aria-hidden="true"></div>
      <div class="confirm-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 6V4h8v2M6 6l1 16h10l1-16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="confirm-content">
        <h2 id="confirm-title">Clear saved history?</h2>
        <p id="confirm-message">Only local automation history will be removed. NotebookLM chat stays.</p>
      </div>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary confirm-primary" type="button">Clear history</button>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading" class="loading hidden">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loading-label" class="loading-label">Loading workspace...</div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
