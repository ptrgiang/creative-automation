<!DOCTYPE html>
<!-- Open this file in Chrome to download Creative Automation extension icons. -->
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Creative Automation Icons</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #dedfd9;
      color: #0b0b0a;
      font-family: Arial, sans-serif;
    }
    canvas {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<canvas id="c" aria-label="Creative Automation icon preview"></canvas>
<script>
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawMark(ctx, size) {
  const scale = size / 64;
  ctx.save();
  ctx.scale(scale, scale);

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#0b0b0a';
  ctx.fillStyle = '#fff35d';

  ctx.beginPath();
  ctx.moveTo(12, 8);
  ctx.lineTo(40, 8);
  ctx.lineTo(40, 24);
  ctx.lineTo(54, 24);
  ctx.lineTo(34, 56);
  ctx.lineTo(34, 39);
  ctx.lineTo(12, 39);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0b0b0a';
  ctx.beginPath();
  ctx.arc(23, 31, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(34, 31, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineWidth = 3;
  [[17, 18], [27, 18]].forEach(([x, y]) => {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 5, y);
    ctx.stroke();
  });

  ctx.restore();
}

function makeIcon(size, download = true) {
  const canvas = document.getElementById('c');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  drawMark(ctx, size);

  if (!download) return;
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `icon${size}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

makeIcon(128, false);
[16, 48, 128].forEach((size, index) => setTimeout(() => makeIcon(size), index * 300));
</script>
</body>
</html>
